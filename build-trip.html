<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build Your Trip · Big Thanksgiving Extravaganza</title>
<style>
body{margin:0;background:#f5f2ea;color:#172222;font-family:Arial,sans-serif}.hero{background:#101b1b;color:white;padding:55px 6%}.ey{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#d9bd69}.hero h1{font:600 58px Georgia,serif;margin:10px 0}.hero p{max-width:700px;color:#d4dfda;line-height:1.7}.wrap{max-width:1200px;width:92%;margin:auto;padding:45px 0}.panel{background:#fffdf9;border:1px solid #dedbd2;border-radius:16px;padding:25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:#967b35;font-weight:bold;margin-bottom:6px}.field input,.field textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d9d5ca;border-radius:8px;background:#fffdf9}.full{grid-column:1/-1}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #d7d1c4;background:#f3f0e8;border-radius:99px;padding:8px 10px;font-size:8px;text-transform:uppercase;cursor:pointer}.chip.active{background:#203b35;color:white}.actions{margin-top:15px;display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #cfc9bb;background:#fffdf9;border-radius:6px;padding:11px 14px;font-size:9px;font-weight:bold;text-transform:uppercase;cursor:pointer;text-decoration:none;color:#172222}.primary{background:#d2b25e;border-color:#d2b25e}.result{margin-top:20px;border-top:1px solid #dedbd2;padding-top:20px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{border:1px solid #dedbd2;border-radius:10px;padding:14px}.card b{font:600 18px Georgia,serif}.card small{display:block;color:#71807c;margin-top:5px;line-height:1.5}.must{display:flex;gap:7px;flex-wrap:wrap}.must span{background:#efebe2;padding:7px 9px;border-radius:99px;font-size:8px}.journal{background:#203b35;color:white;padding:16px;border-radius:10px;margin-top:15px}.journal textarea{width:100%;box-sizing:border-box;min-height:100px;margin-top:8px;border:0;border-radius:7px;padding:10px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:25px}.top a{color:#71807c;font-size:10px}@media(max-width:800px){.grid,.cards{grid-template-columns:1fr}.full{grid-column:auto}.hero h1{font-size:45px}}
</style></head><body>
<header class="hero"><div class="ey">Intelligent trip builder</div><h1>Build Your Trip</h1><p>Create a completely separate journey. Tell the planner where you are going, how much time you have and what your travelers enjoy. Your current trip remains untouched.</p></header>
<main class="wrap"><div class="top"><a href="my-trips.html">← My Trips</a><a href="./">Current trip</a></div><section class="panel">
<div class="grid">
<div class="field"><label>Trip name</label><input id="name" value="My New Adventure"></div><div class="field"><label>Travelers</label><input id="travelers" type="number" min="1" value="2"></div>
<div class="field"><label>Start date</label><input id="start" type="date"></div><div class="field"><label>End date</label><input id="end" type="date"></div>
<div class="field full"><label>Destinations</label><textarea id="dest" placeholder="Prague, Vienna, Budapest"></textarea></div>
<div class="field full"><label>Must-see / must-do places</label><textarea id="must" placeholder="Places you absolutely want included"></textarea></div>
<div class="field full"><label>Traveler preferences</label><div id="prefs" class="chips"></div></div>
</div>
<div class="actions"><button class="btn primary" onclick="generate()">Generate suggestions</button><button class="btn" onclick="save()">Save trip</button></div><div id="result" class="result"></div>
</section></main>
<script>
(function(){
var KEY="big-thanksgiving-trips-v1",prefs=["Local food","History & culture","Christmas markets","Outdoors","Scenic drives","Museums","Easy walking","Family friendly","Nightlife","Coffee & bakeries","Beer & breweries","Photography"];
var cat={prague:["Prague Castle","Old Town Square","Malá Strana & Kampa","Neighborhood food crawl"],trnava:["Trojičné námestie","Hlavná ulica","Town Tower","Little Carpathians / Smolenice"],pilsen:["Republic Square","Pilsner Urquell Brewery","Local Czech dinner"],hluboka:["Hluboká Castle","Old Town walk","Long Czech lunch"],vienna:["Historic center","Christmas market","Neighborhood café"]};
for(var i=0;i<prefs.length;i++){var b=document.createElement("button");b.type="button";b.className="chip";b.textContent=prefs[i];b.setAttribute("data-p",prefs[i]);b.onclick=function(){this.classList.toggle("active")};document.getElementById("prefs").appendChild(b)}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function arr(v){return (v||"").split(/[\n,]/).map(function(x){return x.trim()}).filter(Boolean)}
function days(){var a=document.getElementById("start").value,b=document.getElementById("end").value;if(!a||!b)return 0;return Math.max(1,Math.round((new Date(b)-new Date(a))/86400000)+1)}
function selected(){var n=document.querySelectorAll(".chip.active"),a=[];for(var i=0;i<n.length;i++)a.push(n[i].getAttribute("data-p"));return a}
window.generate=function(){var ds=arr(document.getElementById("dest").value),ms=arr(document.getElementById("must").value),d=days(),el=document.getElementById("result");var h="<div class='ey'>Adaptive suggestions</div><h2 style='font:600 30px Georgia,serif'>Ideas for "+(d||"your")+" days</h2>";if(!ds.length){el.innerHTML=h+"<p>Add at least one destination.</p>";return}h+="<p>Preferences: "+esc(selected().join(", ")||"general traveler preferences")+". Your must-sees remain requirements.</p>";if(ms.length){h+="<div class='must'>";for(var m=0;m<ms.length;m++)h+="<span>"+esc(ms[m])+"</span>";h+="</div>"}h+="<div class='cards'>";for(var x=0;x<ds.length;x++){var key=ds[x].toLowerCase().replace(/[^a-záéíóúýňřěů]/g,"");var a=cat[key]||["Historic center","Local food experience","Signature attraction","Flexible half-day"];var lim=d<=2?2:d<=4?3:4;for(var j=0;j<a.length&&j<lim;j++)h+="<div class='card'><b>"+esc(a[j])+"</b><small>"+esc(ds[x])+" · Suggested based on available time and traveler preferences.</small><div class='actions'><button class='btn' onclick='addMust("+JSON.stringify(a[j]+", "+ds[x])+")'>Add to must-see</button><a class='btn' target='_blank' href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent("+JSON.stringify(a[j]+", "+ds[x])+")>Maps</a></div></div>"} }h+="</div><div class='journal'><div class='ey'>Trip journal</div><textarea id='journal' placeholder='Planning notes, ideas or memories to keep with this trip'></textarea></div>";el.innerHTML=h}
window.addMust=function(x){var f=document.getElementById("must"),a=arr(f.value);if(a.indexOf(x)<0)a.push(x);f.value=a.join(", ");generate()}
window.save=function(){var ds=arr(document.getElementById("dest").value),ms=arr(document.getElementById("must").value),n=document.querySelectorAll(".chip.active"),ps=[];for(var i=0;i<n.length;i++)ps.push(n[i].getAttribute("data-p"));var t={id:"trip-"+Date.now(),name:document.getElementById("name").value||"My New Adventure",travelers:parseInt(document.getElementById("travelers").value,10)||2,start:document.getElementById("start").value,end:document.getElementById("end").value,destinations:ds,mustSee:ms,preferences:ps,days:days(),status:"Planning",journal:(document.getElementById("journal")||{}).value||"",created:new Date().toISOString()};var a;try{a=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){a=[]}a.push(t);localStorage.setItem(KEY,JSON.stringify(a));sessionStorage.setItem("openTripId",t.id);location.href="trip.html"}
})();
</script></body></html>
