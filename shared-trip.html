:12px!important}.rsBrand{gap:8px!important}.rsMark{width:38px!important;height:38px!important;flex-basis:38px!important}.rsMark svg{width:29px!important;height:29px!important}.rsBrand strong{font-size:20px!important}.rsBrand small{font-size:6px!important}.rsLinks{gap:9px!important;flex-wrap:wrap!important;row-gap:6px!important}.rsLinks a{font-size:10px!important}}@media(max-width:560px){.rsTop,.rsNav{min-height:62px!important}.rsNav{padding:8px 11px!important;gap:8px!important}.rsMark{width:34px!important;height:34px!important;flex-basis:34px!important}.rsMark svg{width:26px!important;height:26px!important}.rsBrand strong{font-size:18px!important}.rsBrand small{font-size:5px!important}.rsLinks{gap:6px 8px!important}.rsLinks a{font-size:9px!important}}</style><style id="roamsonio-unified-ui">

<header class="rsTop"><div class="rsNav"><a class="rsBrand" href="index.html" aria-label="RoamSonio home"><span class="rsMark"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29" fill="#F8F5ED"/><circle cx="45" cy="18" r="8" fill="#D4A85A"/><path d="M10 46 25 29l8 9 8-12 13 20H10Z" fill="#0B2D4A"/><path d="M17 20c8-7 18-8 27-4 5 2 8 5 10 9" fill="none" stroke="#D4A85A" stroke-width="3" stroke-linecap="round"/></svg></span><span><strong><span class="rsRoam">Roam</span><span class="rsSonio">Sonio</span></strong><small>DREAM IT. PLAN IT. LIVE IT.</small></span></a><nav class="rsLinks" aria-label="Primary navigation"><a href="index.html">My RoamSonio</a><a href="my-trips.html">My Trips</a><a href="build-trip.html">Build Your Trip</a><a href="travel-desk.html">Travel Desk</a><a href="about.html">About Us</a></nav></div></header>
<main class="wrap"><div id="loading"><div class="ey">Secure access</div><h1>Opening shared trip…</h1></div><div id="app" style="display:none"><section class="hero"><div class="ey">RoamSonio shared journey</div><h1 id="title"></h1><p id="dest"></p><div class="meta"><span class="pill" id="dates"></span><span class="pill" id="travelers"></span><span class="pill" id="access"></span></div></section><div class="grid"><section class="card"><h2>Itinerary</h2><div id="plan"></div></section><aside class="card"><h2>Trip highlights</h2><div id="highlights"></div><div style="margin-top:24px"><h2 style="font-size:24px">Trip areas</h2><ul class="list" id="areas"></ul></div></aside></div></div><div id="error" class="error" style="display:none"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const client=supabase.createClient("https://vqtqchxoecrahtrnoocy.supabase.co","sb_publishable_DyiQBLmIyGMBXCeJ9KKgSg_TFWO5vsy");
const token=new URLSearchParams(location.search).get("token");
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function showError(m,action){document.getElementById("loading").style.display="none";const box=document.getElementById("error");box.innerHTML=esc(m)+(action?"<br><a class=\"errorAction\" href=\""+esc(action.href)+"\">"+esc(action.label)+"</a>":"");box.style.display="block"}
async function load(){
  if(!token){showError("This shared trip link is missing its access code.");return}
  const {data,error}=await client.rpc("get_trip_share",{share_token:token});
  if(error||!data?.length){const msg=error?.message||"This shared trip is not available.";if(msg.toLowerCase().includes("sign in to view this family trip")){showError(msg,{label:"Sign in to RoamSonio",href:"login.html?return="+encodeURIComponent(location.href)});}else{showError(msg);}return}
  const s=data[0],t=s.snapshot||{};const savedKey="roamsonio-received-shares-v1";try{let saved=JSON.parse(localStorage.getItem(savedKey)||"[]");saved=saved.filter(x=>x&&x.token&&x.token!==token);saved.unshift({token:token,trip_name:t.name||s.trip_name||"Shared trip",saved_at:new Date().toISOString()});localStorage.setItem(savedKey,JSON.stringify(saved.slice(0,50)))}catch(e){}
  document.getElementById("loading").style.display="none";document.getElementById("app").style.display="block";
  document.getElementById("title").textContent=t.name||s.trip_name||"Shared trip";
  document.getElementById("dest").textContent=(t.destinations||[]).join(" · ")||"Destination not specified";
  document.getElementById("dates").textContent=(t.start||"Date not set")+" → "+(t.end||"Date not set");
  document.getElementById("travelers").textContent=(t.travelers||"—")+" travelers";
  document.getElementById("access").textContent=s.access_type==="family"?"Family access · view only":"Secure link · view only";
  const plans=Array.isArray(t.plan)?t.plan:[];
  document.getElementById("plan").innerHTML=plans.length?plans.map((d,i)=>"<article class='day'><div class='dayHead'><h3>"+esc(d.title||("Day "+(i+1)))+"</h3><span class='dayDate'>"+esc(d.date||"")+"</span></div><div class='blocks'><div class='block'><b>Morning</b><span>"+esc(d.morning||"Open time")+"</span></div><div class='block'><b>Afternoon</b><span>"+esc(d.afternoon||"Open time")+"</span></div><div class='block'><b>Evening</b><span>"+esc(d.evening||"Open time")+"</span></div></div>"+(d.note?"<p class='note'>"+esc(d.note)+"</p>":"")+"</article>").join(""):"<p class='note'>No itinerary has been added yet.</p>";
  const hi=[...(t.mustSee||[]),...(t.sights||[])].filter(Boolean).slice(0,12);
  document.getElementById("highlights").innerHTML=hi.length?"<ul class='list'>"+hi.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>":"<p class='note'>No highlights have been added yet.</p>";
  const ar=(t.areas||[]).filter(Boolean);document.getElementById("areas").innerHTML=ar.length?ar.slice(0,12).map(x=>"<li>"+esc(x)+"</li>").join(""):"<li>No areas listed.</li>";
}
load();
</script></body></html>
