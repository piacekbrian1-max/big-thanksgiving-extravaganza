<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Invitation · RoamSonio</title><style>:root{--navy:#0B2D4A;--gold:#D4A85A;--ivory:#F8F5ED;--slate:#4F6B8A;--line:#D9E0E7;--paper:#fffdf9}*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--navy);font-family:Arial,sans-serif}.top{height:74px;background:var(--navy);color:#fff;display:flex;align-items:center}.nav{width:94%;max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{font:600 22px Georgia,serif}.sonio{color:var(--gold)}.back{color:#d5dfda;font-size:9px;letter-spacing:.15em;text-transform:uppercase;text-decoration:none}.wrap{max-width:650px;width:92%;margin:auto;padding:70px 0}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:36px}.ey{font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:#a47c2f;font-weight:700}.card h1{font:600 42px Georgia,serif;margin:10px 0}.p{color:var(--slate);font-size:13px;line-height:1.7}.primary{border:0;border-radius:6px;background:var(--gold);color:var(--navy);padding:14px 20px;font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;margin-top:12px}.status{margin-top:18px;padding:12px;border-radius:7px;background:#f5efe1;color:#5f5139;font-size:11px;line-height:1.6}.role{display:inline-block;margin-top:5px;background:#e9f0ec;color:#315f4d;border-radius:999px;padding:7px 10px;font-size:9px;font-weight:800;text-transform:uppercase}</style></head><body><header class="top"><div class="nav"><div class="brand">Roam<span class="sonio">Sonio</span></div><a class="back" href="index.html">RoamSonio</a></div></header><main class="wrap"><section class="card"><div class="ey">Family invitation</div><h1 id="title">You're invited.</h1><p class="p" id="details">Checking this invitation…</p><div id="role"></div><button class="primary" id="accept" style="display:none">Accept invitation</button><div class="status" id="status" style="display:none"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const client=supabase.createClient("https://vqtqchxoecrahtrnoocy.supabase.co","sb_publishable_DyiQBLmIyGMBXCeJ9KKgSg_TFWO5vsy");const token=new URLSearchParams(location.search).get("token"),status=document.getElementById("status"),accept=document.getElementById("accept");function show(m){status.textContent=m;status.style.display="block"}async function load(){if(!token){show("This invitation link is missing its invitation code.");return}const {data,error}=await client.rpc("get_family_invite",{invite_token:token});if(error||!data?.length){show(error?.message||"This invitation could not be found.");return}const i=data[0];document.getElementById("details").textContent="You've been invited by "+(i.invited_by||"the Family Owner")+" to join "+i.family_name+" on RoamSonio.";document.getElementById("role").innerHTML='<span class="role">'+i.role+'</span>';if(i.status!=="pending"){show("This invitation is no longer pending.");return}if(new Date(i.expires_at)<new Date()){show("This invitation has expired.");return}accept.style.display="inline-block"}accept.onclick=async()=>{const {data:{session}}=await client.auth.getSession();if(!session){location.href="login.html?return="+encodeURIComponent(location.href);return}accept.disabled=true;accept.textContent="Joining family…";const {data,error}=await client.rpc("accept_family_invite",{invite_token:token});if(error){show(error.message);accept.disabled=false;accept.textContent="Accept invitation";return}location.href="family.html"};load();</script></body></html>
