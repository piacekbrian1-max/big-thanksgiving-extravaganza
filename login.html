<h1>Welcome back.</h1>
<p>Sign in to access your trips, family spaces, private plans and personal inspiration.</p>
<form id="loginForm">
<div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div>

</form>

<button class="secondary" type="button" id="signupBtn">Create a RoamSonio account</button>

const client=supabase.createClient("https://vqtqchxoecrahtrnoocy.supabase.co","sb_publishable_DyiQBLmIyGMBXCeJ9KKgSg_TFWO5vsy");
const statusBox=document.getElementById("status");
function status(msg){statusBox.textContent=msg;statusBox.classList.add("show")}
document.getElementById("signupBtn").onclick=()=>location.href="signup.html";
